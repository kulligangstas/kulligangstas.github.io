<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Päivänväri · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e10;
    --surface: #18181c;
    --surface2: #222228;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f0;
    --muted: #888;
    --accent: #fff;
    --radius: 14px;
    --active: #fff;
  }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.04;
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6);
  }

  .card-header {
    padding: 28px 28px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--current-color, #fff);
    flex-shrink: 0;
    transition: background 0.4s ease;
    box-shadow: 0 0 12px var(--current-color, transparent);
  }

  .card-header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .badge {
    margin-left: auto;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 99px;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .badge.authed {
    color: #4ade80;
    border-color: rgba(74, 222, 128, 0.3);
    background: rgba(74, 222, 128, 0.06);
  }

  .card-body {
    padding: 24px 28px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  input[type="password"],
  input[type="text"],
  input[type="email"],
  textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--text);
    width: 100%;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
  }

  input[type="password"]:focus,
  input[type="text"]:focus,
  input[type="email"]:focus,
  textarea:focus {
    border-color: rgba(255,255,255,0.25);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
  }

  textarea {
    resize: vertical;
    min-height: 90px;
    line-height: 1.6;
  }

  input::placeholder, textarea::placeholder {
    color: #555;
  }

  .color-label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .color-preview-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
    transition: color 0.3s;
  }

  .color-preview-chip span {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    transition: color 0.3s;
  }

  .color-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }

  .color-ball {
    aspect-ratio: 1;
    border-radius: 10px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    position: relative;
  }

  .color-ball:hover {
    transform: scale(1.08);
  }

  .color-ball.selected {
    border-color: #fff;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.15);
    transform: scale(1.08);
  }

  .color-ball.selected::after {
    content: '✓';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--surface2);
    border-radius: 10px;
    font-size: 12px;
    color: var(--muted);
    min-height: 40px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }

  .status-dot.ok { background: #4ade80; }
  .status-dot.err { background: #f87171; }
  .status-dot.loading {
    background: #facc15;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 0 -28px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 20px;
    border-radius: var(--radius);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.06em;
    cursor: pointer;
    border: none;
    transition: opacity 0.15s, transform 0.1s, background 0.2s;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-primary {
    background: var(--text);
    color: var(--bg);
  }

  .btn-primary:hover:not(:disabled) {
    opacity: 0.9;
  }

  #editor-section {
    display: contents;
  }

  #editor-section.hidden > * {
    display: none;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(0,0,0,0.2);
    border-top-color: #000;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: none;
  }

  .btn.loading .btn-label { display: none; }
  .btn.loading .spinner { display: block; }
</style>
</head>

<body>

<div class="card">
  <div class="card-header">
    <div class="logo-dot" id="logo-dot"></div>
    <h1>Päivänväri</h1>
    <div class="badge" id="auth-badge">ei kirjautunut</div>
  </div>

  <div class="card-body">

    <!-- Auth -->
    <div id="auth-section">
      <div class="field">
        <label>Sähköposti</label>
        <input type="email" id="email" placeholder="admin@example.com" autocomplete="email" />
      </div>
      <div class="field" style="margin-top: 12px;">
        <label>Salasana</label>
        <input type="password" id="password" placeholder="••••••••••" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" id="login-btn" onclick="authenticate()" style="margin-top: 16px;">
        <span class="btn-label">Kirjaudu sisään</span>
        <div class="spinner"></div>
      </button>
      <div class="status-bar" id="auth-status" style="margin-top: 12px; display: none;">
        <div class="status-dot err"></div>
        <span id="auth-status-text"></span>
      </div>
    </div>

    <!-- Editor (hidden until authed) -->
    <div id="editor-section" class="hidden">

      <div class="divider"></div>

      <!-- Color Picker -->
      <div class="field">
        <div class="color-label-row">
          <label>Väri</label>
          <div class="color-preview-chip">
            valittu: <span id="color-hex-label">—</span>
          </div>
        </div>
        <div class="color-grid" id="color-grid"></div>
      </div>

      <!-- Message -->
      <div class="field">
        <label>Viesti</label>
        <textarea id="message" placeholder="Kirjoita viesti tähän..."></textarea>
      </div>

      <!-- Status -->
      <div class="status-bar">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Ladataan tietoja...</span>
      </div>

      <!-- Save -->
      <button class="btn btn-primary" id="save-btn" onclick="save()">
        <span class="btn-label">Tallenna muutokset</span>
        <div class="spinner"></div>
      </button>

    </div>

  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3P-CNmKEx8dEIGo1p49vL9Jk0aOhir2k",
  authDomain: "paivanvari-51e79.firebaseapp.com",
  databaseURL: "https://paivanvari-51e79-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "paivanvari-51e79",
  storageBucket: "paivanvari-51e79.firebasestorage.app",
  messagingSenderId: "999730196442",
  appId: "1:999730196442:web:0a29bac8bdffe527e79ae3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const COLORS = [
  '#FED100', '#64BE1E', '#00985F',
  '#8C4799', '#00B9E4', '#FF6319',
  '#F89DD1', '#D90349', '#007DCB',
  '#FF3CAC'
];

let selectedColor = null;

// ── Build color grid ──
const grid = document.getElementById('color-grid');
COLORS.forEach(hex => {
  const ball = document.createElement('div');
  ball.className = 'color-ball';
  ball.style.backgroundColor = hex;
  ball.setAttribute('title', hex);
  ball.onclick = () => selectColor(hex, ball);
  grid.appendChild(ball);
});

function selectColor(hex, el) {
  document.querySelectorAll('.color-ball').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  selectedColor = hex;
  document.getElementById('color-hex-label').textContent = hex;
  document.getElementById('logo-dot').style.setProperty('--current-color', hex);
  document.documentElement.style.setProperty('--current-color', hex);
}

// ── Auto-login via Firebase persistence ──
// Firebase local persistence keeps the user signed in across page reloads automatically.
// We just listen for the auth state and load the editor if already signed in.
onAuthStateChanged(auth, user => {
  if (user) {
    showEditor();
    loadData();
  }
});

// ── Manual login ──
window.authenticate = async function() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) return;

  const btn = document.getElementById('login-btn');
  btn.classList.add('loading');
  btn.disabled = true;
  hideAuthError();

  try {
    // Use local persistence so the session survives page reloads
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, email, password);
    // onAuthStateChanged will call showEditor() + loadData()
  } catch (e) {
    showAuthError(friendlyError(e.code));
    btn.classList.remove('loading');
    btn.disabled = false;
  }
};

function showEditor() {
  document.getElementById('auth-section').style.display = 'none';
  document.getElementById('editor-section').classList.remove('hidden');
  document.getElementById('auth-badge').textContent = 'kirjautunut';
  document.getElementById('auth-badge').classList.add('authed');
}

async function loadData() {
  setStatus('loading', 'Ladataan tietoja...');
  try {
    const snapshot = await get(ref(db, 'nykyinenVari'));
    const data = snapshot.val();
    if (data) {
      document.getElementById('message').value = data.message || '';
      const currentColor = data.nykyinenVari;
      if (currentColor) {
        document.querySelectorAll('.color-ball').forEach(ball => {
          if (ball.getAttribute('title') === currentColor) {
            selectColor(currentColor, ball);
          }
        });
      }
      setStatus('ok', `Ladattu · nykyinen väri: ${currentColor || '—'}`);
    } else {
      setStatus('ok', 'Yhdistetty · ei aiempia tietoja');
    }
  } catch (e) {
    setStatus('err', 'Lataus epäonnistui: ' + e.message);
  }
}

window.save = async function() {
  if (!selectedColor) {
    setStatus('err', 'Valitse ensin väri');
    return;
  }

  const btn = document.getElementById('save-btn');
  btn.classList.add('loading');
  btn.disabled = true;
  setStatus('loading', 'Tallennetaan...');

  try {
    await set(ref(db, 'nykyinenVari'), {
      message: document.getElementById('message').value,
      nykyinenVari: selectedColor,
    });
    setStatus('ok', `Tallennettu onnistuneesti · ${selectedColor}`);
  } catch (e) {
    setStatus('err', 'Tallennus epäonnistui: ' + e.message);
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
};

function setStatus(type, text) {
  const dot = document.getElementById('status-dot');
  dot.className = 'status-dot';
  if (type) dot.classList.add(type);
  document.getElementById('status-text').textContent = text;
}

function showAuthError(msg) {
  const bar = document.getElementById('auth-status');
  bar.style.display = 'flex';
  document.getElementById('auth-status-text').textContent = msg;
}

function hideAuthError() {
  document.getElementById('auth-status').style.display = 'none';
}

function friendlyError(code) {
  switch (code) {
    case 'auth/invalid-email': return 'Virheellinen sähköpostiosoite.';
    case 'auth/user-not-found': return 'Käyttäjää ei löydy.';
    case 'auth/wrong-password': return 'Väärä salasana.';
    case 'auth/invalid-credential': return 'Väärä sähköposti tai salasana.';
    case 'auth/too-many-requests': return 'Liian monta yritystä. Kokeile myöhemmin.';
    default: return 'Kirjautuminen epäonnistui: ' + code;
  }
}

// ── Enter key on password field ──
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.authenticate();
});

// ── Enter key on email field moves to password ──
document.getElementById('email').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('password').focus();
});

</script>

</body>
</html>
