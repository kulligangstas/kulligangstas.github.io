<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kulli Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f12;
      --surface:   #161920;
      --border:    #252830;
      --muted:     #3a3f4d;
      --accent:    #f0a500;
      --accent2:   #ff6b35;
      --text:      #e8eaf0;
      --text-dim:  #6b7280;
      --self-bg:   #1e1f14;
      --self-acc:  #f0a500;
      --other-bg:  #131720;
      --other-acc: #60a5fa;
      --radius:    12px;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      overflow: hidden;
      /* Prevent iOS bounce scroll and font size inflation */
      -webkit-overflow-scrolling: touch;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* ─── Layout ─── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      /* Use dvh on supported browsers so the input bar sits above the mobile keyboard */
      height: 100dvh;
      max-width: 760px;
      margin: 0 auto;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* ─── Header ─── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .logo {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: grid; place-items: center;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 14px;
      color: var(--bg);
      flex-shrink: 0;
    }
    .header-info { flex: 1; }
    .header-title {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .header-sub {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 1px;
    }
    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
      flex-shrink: 0;
    }
    #status-dot.online { background: #4ade80; box-shadow: 0 0 6px #4ade8066; }
    #week-badge {
      font-size: 10px;
      background: var(--border);
      color: var(--text-dim);
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.05em;
    }

    /* ─── Message Area ─── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
      /* Momentum scrolling on iOS */
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

    /* Day separator */
    .day-sep {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0;
      color: var(--text-dim);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .day-sep::before, .day-sep::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Message row */
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 72%;
      gap: 2px;
      animation: fadeUp 0.2s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-row.self { align-self: flex-end; align-items: flex-end; }
    .msg-row.other { align-self: flex-start; align-items: flex-start; }

    .msg-meta {
      font-size: 10px;
      color: var(--text-dim);
      padding: 0 6px;
      display: flex;
      gap: 8px;
      align-items: baseline;
    }
    .msg-author {
      font-weight: 600;
      font-size: 11px;
    }
    .msg-row.self .msg-author { color: var(--self-acc); }
    .msg-row.other .msg-author { color: var(--other-acc); }

    .msg-bubble {
      padding: 9px 14px;
      border-radius: var(--radius);
      font-size: 13.5px;
      line-height: 1.55;
      word-break: break-word;
      position: relative;
    }
    .msg-row.self .msg-bubble {
      background: var(--self-bg);
      border: 1px solid #2a2800;
      border-bottom-right-radius: 3px;
    }
    .msg-row.other .msg-bubble {
      background: var(--other-bg);
      border: 1px solid #1a2030;
      border-bottom-left-radius: 3px;
    }

    /* ─── Consecutive message grouping ─── */
    .msg-row.grouped { margin-top: 0; }
    .msg-row.grouped .msg-meta { display: none; }
    .msg-row:not(.grouped) { margin-top: 10px; }

    /* ─── Typing indicator ─── */
    #typing-area {
      min-height: 22px;
      padding: 0 20px 4px;
      font-size: 11px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    /* ─── Input Bar ─── */
    #input-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      /* Sit above the iOS home indicator */
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    #msg-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
      height: 42px;
      max-height: 120px;
      line-height: 1.5;
    }
    #msg-input::placeholder { color: var(--muted); }
    #msg-input:focus { border-color: var(--accent); }

    #send-btn {
      width: 42px; height: 42px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: var(--bg);
      cursor: pointer;
      display: grid; place-items: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
      /* Prevent tap highlight flash on mobile */
      -webkit-tap-highlight-color: transparent;
    }
    #send-btn:hover { background: #ffb820; }
    #send-btn:active { transform: scale(0.93); }
    #send-btn svg { pointer-events: none; }

    /* ─── Name prompt overlay ─── */
    #name-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
      /* Keep card clear of the keyboard */
      align-items: flex-end;
      padding-bottom: env(safe-area-inset-bottom);
    }
    #name-overlay.hidden { display: none; }
    .name-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .name-card h2 {
      font-family: var(--sans);
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }
    .name-card p { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
    .name-card input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      /* 16px prevents iOS auto-zoom on focus */
      font-size: 16px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .name-card input:focus { border-color: var(--accent); }
    .name-card button {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: var(--bg);
      font-family: var(--sans);
      font-weight: 700;
      font-size: 14px;
      padding: 11px;
      cursor: pointer;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
      /* Large enough tap target */
      min-height: 44px;
    }
    .name-card button:hover { background: #ffb820; }

    /* ─── Empty state ─── */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-dim);
      font-size: 12px;
      text-align: center;
      padding: 40px;
    }
    #empty-state .big { font-size: 32px; margin-bottom: 4px; }
    #empty-state strong { color: var(--text); font-family: var(--sans); font-size: 15px; }


    /* ═══════════════════════════════════════════
       MOBILE — up to 480px (phone portrait)
    ═══════════════════════════════════════════ */
    @media (max-width: 480px) {
      #app {
        /* No side borders — use the full screen edge-to-edge */
        border-left: none;
        border-right: none;
      }

      header {
        padding: 12px 14px;
        /* Clear notch / dynamic island */
        padding-top: max(12px, env(safe-area-inset-top));
      }

      .header-title { font-size: 14px; }
      .header-sub   { font-size: 10px; }

      /* Hide the week badge to save header space */
      #week-badge { display: none; }

      #chat {
        padding: 14px 10px;
      }

      /* Wider bubbles on narrow screens */
      .msg-row {
        max-width: 86%;
      }

      .msg-bubble {
        font-size: 13px;
        padding: 8px 12px;
      }

      #typing-area {
        padding: 0 14px 4px;
      }

      #input-bar {
        padding: 10px 10px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        gap: 8px;
      }

      #msg-input {
        /* 16px prevents iOS auto-zoom on focus */
        font-size: 16px;
        padding: 9px 12px;
        height: 40px;
      }

      #send-btn {
        /* Apple HIG minimum tap target */
        width: 44px;
        height: 44px;
      }

      /* Name card fills the bottom sheet style on small screens */
      #name-overlay {
        align-items: flex-end;
      }
      .name-card {
        width: 100%;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        border-bottom: none;
        padding: 28px 20px;
        padding-bottom: max(28px, env(safe-area-inset-bottom));
      }
    }


    /* ═══════════════════════════════════════════
       TABLET — 481px–768px (landscape phones,
       small tablets)
    ═══════════════════════════════════════════ */
    @media (min-width: 481px) and (max-width: 768px) {
      #app {
        border-left: none;
        border-right: none;
      }

      .msg-row { max-width: 78%; }

      header { padding: 14px 18px; }

      #chat { padding: 16px 14px; }

      #input-bar { padding: 12px 14px; }

      /* Still bump font-size to avoid iOS zoom */
      #msg-input  { font-size: 16px; }
    }


    /* ═══════════════════════════════════════════
       LANDSCAPE PHONES — short viewport
    ═══════════════════════════════════════════ */
    @media (max-height: 500px) and (orientation: landscape) {
      header {
        padding-top: 8px;
        padding-bottom: 8px;
      }

      /* Compact the logo in landscape */
      .logo { width: 28px; height: 28px; font-size: 12px; }

      #chat { padding: 8px 12px; }

      .msg-row:not(.grouped) { margin-top: 6px; }

      #typing-area { min-height: 16px; padding-bottom: 2px; }

      #input-bar { padding: 8px 12px; }

      #send-btn { width: 38px; height: 38px; }
      #msg-input { height: 38px; }
    }
  </style>
</head>
<body>

<div id="app">
  <header>
    <div class="logo">K</div>
    <div class="header-info">
      <div class="header-title">Kulli Chat</div>
      <div class="header-sub" id="user-label">yhdistetään...</div>
    </div>
    <span id="week-badge">pv —</span>
    <div id="status-dot"></div>

  <div id="chat">

    </div>
  </div>

  <div id="typing-area"></div>

  <div id="input-bar">

    <button id="send-btn" title="Lähetä">

        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

  async function decryptAES(encryptedBase64, password) {
  const [ivB64, dataB64] = encryptedBase64.split(":");
  const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
  const data = Uint8Array.from(atob(dataB64), c => c.charCodeAt(0));

  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw",
    enc.encode(password),
    { name: "PBKDF2" },
    false,
    ["deriveKey"]
  );

  const key = await crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt: iv,
      iterations: 100000,
      hash: "SHA-256"
    },
    keyMaterial,
    { name: "AES-CBC", length: 256 },
    false,
    ["decrypt"]
  );

  try {
    const decrypted = await crypto.subtle.decrypt(
      { name: "AES-CBC", iv },
      key,
      data
    );
    const dec = new TextDecoder();
    return dec.decode(decrypted); // ✅ legal now
  } catch (e) {
    return null; // ✅ legal now
  }
}
