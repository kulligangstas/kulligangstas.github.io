<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kulli Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f12;
      --surface:   #161920;
      --border:    #252830;
      --muted:     #3a3f4d;
      --accent:    #f0a500;
      --accent2:   #ff6b35;
      --text:      #e8eaf0;
      --text-dim:  #6b7280;
      --self-bg:   #1e1f14;
      --self-acc:  #f0a500;
      --other-bg:  #131720;
      --other-acc: #60a5fa;
      --radius:    12px;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      overflow: hidden;
    }

    /* ─── Layout ─── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 760px;
      margin: 0 auto;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* ─── Header ─── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .logo {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: grid; place-items: center;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 14px;
      color: var(--bg);
      flex-shrink: 0;
    }
    .header-info { flex: 1; }
    .header-title {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .header-sub {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 1px;
    }
    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
      flex-shrink: 0;
    }
    #status-dot.online { background: #4ade80; box-shadow: 0 0 6px #4ade8066; }
    #week-badge {
      font-size: 10px;
      background: var(--border);
      color: var(--text-dim);
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.05em;
    }

    /* ─── Message Area ─── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
    }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

    /* Day separator */
    .day-sep {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0;
      color: var(--text-dim);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .day-sep::before, .day-sep::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Message row */
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 72%;
      gap: 2px;
      animation: fadeUp 0.2s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-row.self { align-self: flex-end; align-items: flex-end; }
    .msg-row.other { align-self: flex-start; align-items: flex-start; }

    .msg-meta {
      font-size: 10px;
      color: var(--text-dim);
      padding: 0 6px;
      display: flex;
      gap: 8px;
      align-items: baseline;
    }
    .msg-author {
      font-weight: 600;
      font-size: 11px;
    }
    .msg-row.self .msg-author { color: var(--self-acc); }
    .msg-row.other .msg-author { color: var(--other-acc); }

    .msg-bubble {
      padding: 9px 14px;
      border-radius: var(--radius);
      font-size: 13.5px;
      line-height: 1.55;
      word-break: break-word;
      position: relative;
    }
    .msg-row.self .msg-bubble {
      background: var(--self-bg);
      border: 1px solid #2a2800;
      border-bottom-right-radius: 3px;
    }
    .msg-row.other .msg-bubble {
      background: var(--other-bg);
      border: 1px solid #1a2030;
      border-bottom-left-radius: 3px;
    }

    /* ─── Consecutive message grouping ─── */
    .msg-row.grouped { margin-top: 0; }
    .msg-row.grouped .msg-meta { display: none; }
    .msg-row:not(.grouped) { margin-top: 10px; }

    /* ─── Typing indicator ─── */
    #typing-area {
      min-height: 22px;
      padding: 0 20px 4px;
      font-size: 11px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    /* ─── Input Bar ─── */
    #input-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    #msg-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
      height: 42px;
      max-height: 120px;
      line-height: 1.5;
    }
    #msg-input::placeholder { color: var(--muted); }
    #msg-input:focus { border-color: var(--accent); }

    #send-btn {
      width: 42px; height: 42px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: var(--bg);
      cursor: pointer;
      display: grid; place-items: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    #send-btn:hover { background: #ffb820; }
    #send-btn:active { transform: scale(0.93); }
    #send-btn svg { pointer-events: none; }

    /* ─── Name prompt overlay ─── */
    #name-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    #name-overlay.hidden { display: none; }
    .name-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .name-card h2 {
      font-family: var(--sans);
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }
    .name-card p { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
    .name-card input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .name-card input:focus { border-color: var(--accent); }
    .name-card button {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: var(--bg);
      font-family: var(--sans);
      font-weight: 700;
      font-size: 14px;
      padding: 11px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .name-card button:hover { background: #ffb820; }

    /* ─── Empty state ─── */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-dim);
      font-size: 12px;
      text-align: center;
      padding: 40px;
    }
    #empty-state .big { font-size: 32px; margin-bottom: 4px; }
    #empty-state strong { color: var(--text); font-family: var(--sans); font-size: 15px; }
  </style>
</head>
<body>

<div id="app">
  <header>
    <div class="logo">K</div>
    <div class="header-info">
      <div class="header-title">Kulli Chat</div>
      <div class="header-sub" id="user-label">yhdistetään...</div>
    </div>
    <span id="week-badge">pv —</span>
    <div id="status-dot"></div>
  </header>

  <div id="chat">
    <div id="empty-state">
      <div class="big">💬</div>
      <strong>Ei vielä viestejä.</strong>
      <span>Ole ensimmäinen lähettämään jotain tänään.</span>
    </div>
  </div>

  <div id="typing-area"></div>

  <div id="input-bar">
    <textarea id="msg-input" placeholder="Kirjoita viesti…" rows="1"></textarea>
    <button id="send-btn" title="Lähetä">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

async function decryptAES(encryptedBase64, password) {
  const [ivB64, dataB64] = encryptedBase64.split(":");
  const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
  const data = Uint8Array.from(atob(dataB64), c => c.charCodeAt(0));

  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw",
    enc.encode(password),
    { name: "PBKDF2" },
    false,
    ["deriveKey"]
  );

  const key = await crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt: iv,
      iterations: 100000,
      hash: "SHA-256"
    },
    keyMaterial,
    { name: "AES-CBC", length: 256 },
    false,
    ["decrypt"]
  );

  try {
    const decrypted = await crypto.subtle.decrypt(
      { name: "AES-CBC", iv },
      key,
      data
    );
    const dec = new TextDecoder();
    return dec.decode(decrypted); // ✅ legal now
  } catch (e) {
    return null; // ✅ legal now
  }
}
